name: ARABA Backend CI

on:
  push:
    branches:
      - main
      - feat/cloud-mobile-key
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "cloudbuild.yaml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "Dockerfile"
      - ".dockerignore"
      - "cloudbuild.yaml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Test
        run: python manage.py test
