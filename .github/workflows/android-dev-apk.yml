name: ARABA Android Dev APK

on:
  push:
    branches:
      - main
      - feat/cloud-mobile-key
      - fix/live-sdp-eof
    paths:
      - "mobile/**"
      - ".github/workflows/android-dev-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Android debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: araba-android-debug-keystore-v1

      - name: Ensure stable Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=ARABA Dev,O=ARABA,C=KR"
          fi

      - name: Verify Android signing key
        run: |
          echo "=== DEBUG KEYSTORE ==="
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | grep -E "Alias name:|Owner:|SHA256:"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify built APK certificate
        shell: bash
        run: |
          EXPECTED="$(keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            | awk '/SHA256:/ {print $2; exit}' \
            | tr -d ':' \
            | tr '[:upper:]' '[:lower:]')"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          ACTUAL="$("$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-debug.apk \
            | tee /tmp/apk-certs.txt \
            | awk '/certificate SHA-256 digest/ {print tolower($NF); exit}')"

          echo "EXPECTED_SHA256=$EXPECTED"
          echo "ACTUAL_SHA256=$ACTUAL"

          test "$EXPECTED" = "$ACTUAL"

      - name: Prepare stable APK name
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/araba-dev.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: araba-dev-apk
          path: mobile/build/app/outputs/flutter-apk/araba-dev.apk
          if-no-files-found: error

      - name: Publish latest dev APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest \
            build/app/outputs/flutter-apk/araba-dev.apk \
            --target "$GITHUB_SHA" \
            --title "ARABA Dev Latest" \
            --notes "자동 빌드된 최신 ARABA 개발용 APK입니다." \
            --prerelease

      - name: Notify ARABA devices
        if: github.ref == 'refs/heads/main'
        working-directory: .
        shell: bash
        run: |
          RESPONSE="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=araba-update-notifier")"

          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$RESPONSE")"

          for attempt in $(seq 1 18); do
            STATUS="$(curl -sS \
              -o /tmp/araba-notify-response.json \
              -w "%{http_code}" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              -X POST \
              "https://araba-api-dev-908580697493.asia-northeast3.run.app/api/internal/notify-update/" \
              -d '{}')"

            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              cat /tmp/araba-notify-response.json
              echo
              exit 0
            fi

            echo "Notify attempt $attempt failed with HTTP $STATUS"
            cat /tmp/araba-notify-response.json || true
            echo

            if [ "$STATUS" -ge 400 ] && [ "$STATUS" -lt 500 ]; then
              echo "Permanent client/auth error. Not retrying."
              exit 1
            fi

            if [ "$attempt" -lt 18 ]; then
              sleep 10
            fi
          done

          exit 1
