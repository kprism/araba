name: ARABA Android Dev APK

on:
  push:
    branches:
      - main
      - feat/cloud-mobile-key
    paths:
      - "mobile/**"
      - ".github/workflows/android-dev-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore ARABA debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: araba-android-debug-keystore-v1

      - name: Ensure stable debug signing key
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=ARABA Dev,O=ARABA,C=KR" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: |
          flutter build apk --debug \
            --dart-define=ARABA_FIREBASE_API_KEY=AIzaSyCXt3d_t8Ed_6EdigbcoBNJnr4-2qODAp8 \
            --dart-define=ARABA_FIREBASE_APP_ID=1:908580697493:android:24a7c27df3d23423a4329c \
            --dart-define=ARABA_FIREBASE_MESSAGING_SENDER_ID=908580697493 \
            --dart-define=ARABA_FIREBASE_PROJECT_ID=araba-dev

      - name: Prepare stable APK name
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/araba-dev.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: araba-dev-apk
          path: mobile/build/app/outputs/flutter-apk/araba-dev.apk
          if-no-files-found: error

      - name: Publish latest dev APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest             build/app/outputs/flutter-apk/araba-dev.apk             --target "$GITHUB_SHA"             --title "ARABA Dev Latest"             --notes "자동 빌드된 최신 ARABA 개발용 APK입니다."             --prerelease
